name: Validate Renovate preset

on:
  pull_request:
    paths: ["**.json5", ".github/workflows/validate.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.117.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Validate every preset file
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict --no-global ./*.json5 .renovaterc.json5 # the glob skips dotfiles
